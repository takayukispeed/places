# Whenever places change (including edits made in the app): look up map coordinates for
# places that don't have them yet, and rebuild INDEX.md.
name: Rebuild index
on:
  push:
    branches: [main]
    paths: ["places/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/geocode_places.py
      - run: python3 scripts/build_index.py
      - name: Commit if changed
        run: |
          git diff --quiet INDEX.md places && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rebuild index and map coordinates"
          git pull --rebase origin main
          git push
