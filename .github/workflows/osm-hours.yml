# Manual, read-only report of what OpenStreetMap has for each place (hours, phone, website).
# Run it from the Actions tab and read the log; it changes nothing.
name: Check hours against OpenStreetMap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/osm_hours.py
